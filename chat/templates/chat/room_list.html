{% extends 'base.html' %}
{% block title %}내 채팅{% endblock %}
{% block content %}
<h1>내 채팅</h1>
<ul>
{% for room in rooms %}
    <li>
        <a href="{% url 'chat:room_detail' room.pk %}">
            {{ room.item.description|truncatechars:20 }}
            ({{ room.buyer.nickname }} ↔ {{ room.seller.nickname }})
        </a>
    </li>
{% empty %}
    <li>진행 중인 채팅이 없습니다.</li>
{% endfor %}
</ul>
{% endblock %}
