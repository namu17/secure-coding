{% extends 'base.html' %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>로그인</h1>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">로그인</button>
    </form>
    <p class="auth-footer">
        계정이 없으신가요? <a href="{% url 'accounts:register' %}">회원가입</a>
    </p>
</div>
{% endblock %}
